[project]
name = "mistertimer"
version = "0.1.9"
description = "MisterTimer — OBS head-tracking widget. Pin any source to streamer's forehead."
requires-python = ">=3.11,<3.14"
dependencies = [
    "nicegui>=1.4.0,<2.0.0",
    "mediapipe>=0.10.0",
    "opencv-python-headless>=4.8.0",
    "obsws-python>=1.0.0",
    "numpy>=1.24.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

[project.scripts]
mistertimer = "run:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
